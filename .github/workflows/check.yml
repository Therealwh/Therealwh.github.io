name: Proxy availability check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proxy-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check proxy availability
        run: python check.py

      - name: Commit status update
        run: |
          git config user.name "proxy-status-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes — skip commit"
          else
            git commit -m "chore: proxy status $(date -u +%FT%TZ)"
            git push
          fi
